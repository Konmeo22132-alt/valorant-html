<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haven — Xem map low-poly</title>
<style>html,body{margin:0;height:100%;background:#b9cbd2;font-family:Segoe UI,sans-serif;color:#edf5f4}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}header{position:absolute;left:24px;top:22px;padding:16px 20px;background:#102733e8;border-top:2px solid #9cddc5;max-width:440px}h1{font-size:27px;letter-spacing:.12em;margin:0 0 7px}p{font-size:12px;line-height:1.6;margin:0;color:#c8dadb}nav{position:absolute;right:24px;top:22px;display:flex;gap:7px}button{border:1px solid #8aafad;background:#173440ed;color:#eaf3ef;padding:11px 17px;cursor:pointer;font:600 12px Segoe UI,sans-serif}button[aria-pressed=true]{background:#3a8d81}#status{position:absolute;inset:0;display:grid;place-items:center;background:#142a37e8;font-size:17px;text-align:center;padding:40px}#status[hidden]{display:none}footer{position:absolute;left:24px;bottom:20px;background:#142b37dd;padding:9px 14px;font-size:11px;color:#c4d6d8;pointer-events:none}</style>
</head><body><canvas id="map" aria-label="Map Haven low-poly, kéo chuột để xoay"></canvas><header><h1>HAVEN</h1><p id="stats">Đang đọc thông tin map…</p></header><nav aria-label="Góc nhìn map"><button data-view="all" aria-pressed="true">TỔNG QUAN</button><button data-view="a">SITE A</button><button data-view="b">SITE B</button><button data-view="c">SITE C</button></nav><div id="status" role="status">Đang tải map Haven…</div><footer>Kéo chuột trái: xoay · Chuột phải: dịch chuyển · Cuộn: thu/phóng</footer>
<script src="/assets/vendor/babylon.js"></script><script src="/assets/vendor/babylonjs.loaders.min.js"></script><script src="/game/map-presentation.js"></script><script>
const B=BABYLON,canvas=document.getElementById('map'),status=document.getElementById('status');
B.DracoCompression.Configuration={decoder:{wasmUrl:'/game/draco/draco_wasm_wrapper.js',wasmBinaryUrl:'/game/draco/draco_decoder.wasm',fallbackUrl:'/game/draco/draco_decoder.js'}};
const engine=new B.Engine(canvas,true,{powerPreference:'low-power',stencil:false},false),scene=new B.Scene(engine);scene.clearColor=new B.Color4(.69,.76,.79,1);scene.imageProcessingConfiguration.exposure=1.0;scene.imageProcessingConfiguration.contrast=1.12;
const camera=new B.ArcRotateCamera('review',-.8,.7,150,new B.Vector3(0,0,0),scene);camera.minZ=.3;camera.maxZ=700;camera.lowerRadiusLimit=3;camera.upperRadiusLimit=340;camera.wheelPrecision=12;camera.panningSensibility=130;camera.attachControl(canvas,true);
// Use the exact gameplay presentation; no separate preview-only light preset.
const ambient=new B.HemisphericLight('sky',B.Vector3.Up(),scene);
const shadows=VSMapPresentation.haven(scene,ambient);
VSMapPresentation.cameras(scene,'haven',{mapContactShadows:new URLSearchParams(location.search).get('ao')!=='off'});
const point=p=>new B.Vector3(-p[0],p[2],-p[1]),views={all:[[125,-80,155],[17,90,6],165],a:[[98,60,39],[61,94,5],58],b:[[18,82,4.65],[22,98,4.7]],c:[[-60,60,39],[-20,96,5],57]};let activeUntil=performance.now()+1500,last=0;
function view(key){camera.setTarget(point(views[key][1]));camera.setPosition(point(views[key][0]));camera.fov=views[key][2]?2*Math.atan(views[key][2]/(2*camera.radius*engine.getAspectRatio(camera))):.8;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===key)));activeUntil=performance.now()+1500;}
function resize(){engine.setHardwareScalingLevel(Math.max(1,canvas.clientWidth/1400,canvas.clientHeight/1000));engine.resize();activeUntil=performance.now()+1500;}resize();window.addEventListener('resize',resize);
for(const type of ['pointermove','wheel','keydown'])canvas.addEventListener(type,()=>activeUntil=performance.now()+1000);canvas.addEventListener('pointerdown',()=>activeUntil=Infinity);window.addEventListener('pointerup',()=>activeUntil=performance.now()+1000);
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>view(button.dataset.view));view('all');
engine.runRenderLoop(()=>{const now=performance.now();if(document.hidden||now>activeUntil||now-last<1000/30)return;last=now;scene.render();});
(async()=>{try{const response=await fetch('/assets/maps/optimized/haven-art/manifest.json');if(!response.ok)throw Error('Không đọc được thông tin map');const m=await response.json();document.getElementById('stats').textContent=m.renderTriangles.toLocaleString('vi-VN')+' tam giác · '+(m.standaloneBytes/1048576).toFixed(2)+' MiB · '+m.chunks.length+' cụm geometry';await B.SceneLoader.AppendAsync('/assets/maps/optimized/haven-art/',m.standalone,scene,event=>{if(event.lengthComputable)status.textContent='Đang tải map Haven… '+Math.floor(event.loaded/event.total*100)+'%';});for(const mesh of scene.meshes){if(mesh.getTotalVertices()>0){mesh.metadata={...mesh.metadata,streamedWorld:true};mesh.receiveShadows=true;shadows.addShadowCaster(mesh,false);scene._mapContactGeometry?.renderList?.push(mesh);}}shadows.getShadowMap().resetRefreshCounter();await scene.whenReadyAsync();let warmFrames=0;const warmup=scene.onAfterRenderObservable.add(()=>{if(++warmFrames>=30){shadows.getShadowMap().refreshRate=B.RenderTargetTexture.REFRESHRATE_RENDER_ONCE;scene.onAfterRenderObservable.remove(warmup);}});status.hidden=true;activeUntil=performance.now()+3000;}catch(error){status.textContent='Không tải được map: '+error.message;console.error(error);}})();
window.addEventListener('pagehide',()=>{scene.dispose();engine.dispose();},{once:true});
</script></body></html>
